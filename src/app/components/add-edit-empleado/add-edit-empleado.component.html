<div class="row">
    <div class="col-lg-6">
        <h2>Agregar Empleado</h2>
    </div>
</div>
<div class="row">
    <div class="col-lg-4">
        <h2>Formulario</h2>
        <form action="">
            <div class="col-lg-12">
                <mat-form-field class="example-container" [style.fontsize.px]=16>
                    <mat-label>Nombres</mat-label>
                    <input matInput>
                </mat-form-field>
            </div>
            <div class="col-lg-12">
                <mat-form-field class="example-container" [style.fontsize.px]=16>
                    <mat-label>Correo</mat-label>
                    <input matInput>
                </mat-form-field>
            </div>
            <div class="col-lg-12">
                <mat-form-field class="example-container" [style.fontsize.px]=16>
                    <mat-label>Fecha Ingreso</mat-label>
                    <input matInput [matDatepicker]="picker">
                    <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
                    <mat-datepicker #picker></mat-datepicker>
                </mat-form-field>
            </div>
            <div class="col-lg-12">
                <mat-form-field class="example-container">
                    <mat-label>Telefono</mat-label>
                    <input matInput>
                </mat-form-field>
            </div>
            <div class="col-lg-12">
                <mat-form-field class="example-container">
                    <mat-label>Estado Civil</mat-label>
                    <mat-select>
                        @for (estadoCivil of estadosCiviles; track estadoCivil) {
                        <mat-option [value]="estadoCivil">{{estadoCivil}}</mat-option>
                        }
                    </mat-select>
                </mat-form-field>   
            </div>
            <div class="col-lg-12">
                Sexo
            </div>
            <div class="col-lg-12">
                BOTONES
            </div>
        </form>
    </div>
    <div class="col-lg-4 offset-lg-2">
        <img src="img/empleado.png" alt="Avatar" width="95%" height="95%">
    </div>
</div>
